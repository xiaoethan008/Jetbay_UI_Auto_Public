[pytest]
testpaths = tests
addopts = -ra -q --ignore=tests/test_inspect.py -m "not special_pending"
markers =
    special_pending: supplementary special-test scenarios awaiting historical acceptance; excluded from default regression
    allow_error_page: tests intentionally visit and assert the site's 404/error page
    p0: priority P0
    p1: priority P1
    p2: priority P2
    p3: priority P3
